# TheSuperHackers @build O140 Generals Collection x64: the macOS / Linux port builds (M3).
# Build only, no game data: the replay CRC comparison runs on self-hosted runners (crc-selfhosted.yml).
# The macOS and Linux jobs build the headless games (RTS_BUILD_HEADLESS, O158) and run a smoke test without data; they
# are allowed to fail (continue-on-error) until the port compiles there.
name: Mac CI

permissions:
  contents: read

on:
  push:
    branches:
      - mac
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unix:
    # O146: continue-on-error makes the run green while these jobs still fail; the name says so.
    name: Build headless ${{ matrix.preset }} (porting, may fail)
    if: github.repository != 'TheSuperHackers/GeneralsGameCode'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # O144: macos-14 is no longer offered ("configuration not supported"); macos-latest is an Apple Silicon image.
          - os: macos-latest
            preset: macos-arm64
          - os: ubuntu-24.04-arm
            preset: linux-arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Build Tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Install Build Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build Headless Games
        shell: bash
        run: |
          set -o pipefail
          # O158: the headless games (RTS_BUILD_HEADLESS: libraries, device layer with the null renderer, executables);
          # -k 0 shows every failing file.
          cmake --build build/${{ matrix.preset }} --target z_generals g_generals -- -k 0 2>&1 | tee build.log

      # O158: a smoke test without game data. -help must print the usage and exit 0; a start without data must end
      # by itself (no crash signal, no hang). O163: the step goes on after a failing run (the default shell is
      # bash -e), and a crash is run again under the debugger (gdb / lldb) for a backtrace. Exit codes, the last lines
      # of the output and the backtrace go to notices (the raw log needs a signed-in account).
      - name: Install Debugger (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gdb

      - name: Smoke Test
        shell: bash
        run: |
          set +e
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "### Smoke test (no game data)" >> "$summary"
          status=0
          note() { # title, file
            local text
            text=$(tail -c 3000 "$2" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$text" ] || text="(no output)" # O164: an empty notice is dropped by GitHub
            echo "::notice title=$1::$text"
          }
          backtrace() { # exe, args...
            local exe="$1"; shift
            if [ "$RUNNER_OS" = "Linux" ]; then
              gdb -batch -ex run -ex bt -ex quit --args "$exe" "$@" > bt.txt 2>&1
            else
              lldb --batch -o run -o "bt 40" -o quit -- "$exe" "$@" > bt.txt 2>&1
            fi
            grep -v '^\[\|^Reading\|^warning: ' bt.txt | tail -60 > bt_short.txt
          }
          for exe in $(find build/${{ matrix.preset }} -type f \( -name 'generalszh*' -o -name 'generalsv*' \) -perm -u+x); do
            name=$(basename "$exe")
            ./"$exe" -help > help.txt 2>&1; help=$?
            echo "- \`$name -help\`: exit $help" >> "$summary"
            note "$name -help exit $help" help.txt
            if [ $help -ne 0 ]; then
              backtrace "./$exe" -help
              note "$name -help backtrace" bt_short.txt
            fi
            mkdir -p smoke
            ( cd smoke && perl -e 'alarm shift; exec @ARGV' 120 "../$exe" -headless > ../start.txt 2>&1 ); start=$?
            echo "- \`$name -headless\` without data: exit $start" >> "$summary"
            note "$name -headless exit $start" start.txt
            if [ $start -ge 128 ] && [ $start -ne 142 ]; then
              ( cd smoke && backtrace "../$exe" -headless )
              note "$name -headless backtrace" smoke/bt_short.txt
            fi
            if [ $help -ne 0 ] || [ $start -ge 124 ]; then status=1; fi
          done
          exit $status

      # O144: the raw job log needs a signed-in account; the errors also go to annotations and the job summary.
      - name: Report Compile Errors
        if: failure()
        shell: bash
        run: python3 scripts/ci/report_errors.py build.log

  build-windows:
    name: Build win64 (reference)
    if: github.repository != 'TheSuperHackers/GeneralsGameCode'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # O150: the Visual Studio environment from the runner's own vswhere and vcvars64.bat (ilammy/msvc-dev-cmd has no
      # release for Node.js 24; its v1.13.0 runs on the deprecated Node.js 20).
      - name: Configure and Build Games
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --preset win64 -DRTS_BUILD_OPTION_RETAIL_COMPATIBLE_GAME=OFF -DRTS_AUDIO_BACKEND=miniaudio || exit /b 1
          cmake --build build/win64 --config Release --target z_generals g_generals || exit /b 1
