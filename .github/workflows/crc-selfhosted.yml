# TheSuperHackers @build O140 Generals Collection x64: the replay CRC gate of the macOS port (M3), on self-hosted runners.
#
# The game data never leaves the runner machines: each runner has the games installed and names their folders in its
# own environment (variables RTS_GAME_DIR_GENERALS and RTS_GAME_DIR_ZEROHOUR, set on the runner, not in this repository).
# play_golden.py plays Tests/GoldenReplays with -logicCrcLog; only the per-frame CRC logs (numbers, no game data) are
# uploaded as artifacts, and the last job compares them frame by frame.
#
# Manual only (workflow_dispatch): a public repository must not run code of other people's pull requests on these
# machines. Runner labels: "generals-windows" (Windows x64) and "generals-macos" (Apple Silicon). See
# Tests/GoldenReplays/README.md for setting a runner up.
name: Replay CRC (self-hosted)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mac:
        description: 'Also run on the Mac runner (needs the headless macOS build)'
        required: false
        default: false
        type: boolean

jobs:
  windows:
    name: Windows x64 replays
    if: github.repository != 'TheSuperHackers/GeneralsGameCode'
    runs-on: [self-hosted, Windows, X64, generals-windows]
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build
        shell: cmd
        run: |
          call "%VS_VCVARS64%" || exit /b 1
          cmake --preset win64 -B build\ci -DRTS_BUILD_OPTION_RETAIL_COMPATIBLE_GAME=OFF -DRTS_AUDIO_BACKEND=miniaudio || exit /b 1
          cmake --build build\ci --config Release --target z_generals g_generals || exit /b 1

      - name: Play Golden Replays
        shell: pwsh
        run: |
          python scripts/ci/play_golden.py --game GeneralsMD --exe build/ci/GeneralsMD/Release/generalszh.exe --game-dir "$env:RTS_GAME_DIR_ZEROHOUR" --work-dir "$env:RUNNER_TEMP/zh" --out crc/windows-x64
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/ci/play_golden.py --game Generals --exe build/ci/Generals/Release/generalsv.exe --game-dir "$env:RTS_GAME_DIR_GENERALS" --work-dir "$env:RUNNER_TEMP/g" --out crc/windows-x64
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload CRC Logs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: crc-windows-x64
          path: crc/windows-x64/*.crc.log
          retention-days: 30

  macos:
    name: macOS arm64 replays
    if: github.repository != 'TheSuperHackers/GeneralsGameCode' && inputs.mac
    runs-on: [self-hosted, macOS, ARM64, generals-macos]
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build
        run: |
          cmake --preset macos-arm64 -B build/ci -DRTS_BUILD_CORE_ONLY=OFF
          cmake --build build/ci --target z_generals g_generals

      - name: Play Golden Replays
        run: |
          python3 scripts/ci/play_golden.py --game GeneralsMD --exe build/ci/GeneralsMD/generalszh --game-dir "$RTS_GAME_DIR_ZEROHOUR" --work-dir "$RUNNER_TEMP/zh" --out crc/macos-arm64
          python3 scripts/ci/play_golden.py --game Generals --exe build/ci/Generals/generalsv --game-dir "$RTS_GAME_DIR_GENERALS" --work-dir "$RUNNER_TEMP/g" --out crc/macos-arm64

      - name: Upload CRC Logs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: crc-macos-arm64
          path: crc/macos-arm64/*.crc.log
          retention-days: 30

  compare:
    name: Compare CRC logs
    needs: [windows, macos]
    if: github.repository != 'TheSuperHackers/GeneralsGameCode' && inputs.mac && needs.windows.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download CRC Logs
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: crc-*
          path: crc

      - name: Compare Frame by Frame
        run: python3 scripts/ci/compare_crc_dirs.py crc/crc-windows-x64 crc/crc-macos-arm64
