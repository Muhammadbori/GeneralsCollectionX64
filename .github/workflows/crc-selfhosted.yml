# TheSuperHackers @build O140 Generals Collection x64: the replay CRC gate of the macOS port (M3), on a self-hosted Mac.
#
# O165/O166: one self-hosted runner, an Apple Silicon Mac (label "generals-macos"), which needs no build tools:
#   1. build:   GitHub's macos-latest runner builds the headless games (Release, the macos-arm64 preset, as mac-ci) and
#               packs the two executables, the golden replays and the play script in one tar (keeps the +x bits).
#   2. replays: the Mac downloads that package and plays the replays with scripts/ci/play_golden.sh (plain sh, nothing
#               to install: no Xcode command line tools, Homebrew, cmake or Python). No checkout there either (git on
#               a clean Mac asks for the command line tools).
#   3. compare: ubuntu-latest compares the Mac's per-frame CRC logs with the Windows x64 reference logs in
#               Tests/GoldenReplays/crc/windows-x64 (numbers only, no game data).
#
# The game data never leaves the Mac: the runner names its game folder in its own .env file (RTS_GAME_DIR_ZEROHOUR and
# RTS_GAME_DIR_GENERALS, not in this repository); only the CRC logs and the console output of the runs are uploaded.
#
# Manual only (workflow_dispatch), and only in this owner's repository: a public repository must never run code from
# other people's pull requests on this machine. See dx12-notes/plan10-boburbek-mac-runner.md for setting the Mac up.
name: Replay CRC (self-hosted)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build:
    name: Build headless games (macOS arm64)
    if: github.event_name == 'workflow_dispatch' && github.repository_owner == 'Muhammadbori'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Build Tools
        run: brew install ninja

      - name: Build
        run: |
          cmake --preset macos-arm64 -B build/ci
          cmake --build build/ci --target z_generals g_generals

      - name: Pack
        run: |
          mkdir -p package/bin package/replays
          cp build/ci/GeneralsMD/generalszh build/ci/Generals/generalsv package/bin/
          cp -R Tests/GoldenReplays/Generals Tests/GoldenReplays/GeneralsMD package/replays/
          cp scripts/ci/play_golden.sh package/
          chmod +x package/bin/* package/play_golden.sh
          tar -czf headless-macos-arm64.tar.gz -C package .

      - name: Upload Package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: headless-macos-arm64
          path: headless-macos-arm64.tar.gz
          retention-days: 7

  replays:
    name: Play golden replays (self-hosted Mac)
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.repository_owner == 'Muhammadbori'
    runs-on: [self-hosted, macOS, ARM64, generals-macos]
    timeout-minutes: 120
    steps:
      - name: Download Package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: headless-macos-arm64
          path: ${{ runner.temp }}/package

      - name: Unpack
        shell: sh
        run: |
          cd "$RUNNER_TEMP/package"
          tar -xzf headless-macos-arm64.tar.gz
          chmod +x bin/* play_golden.sh

      - name: Check Game Folders
        shell: sh
        run: |
          for d in "${RTS_GAME_DIR_ZEROHOUR:-}" "${RTS_GAME_DIR_GENERALS:-}"; do
            if [ -z "$d" ] || [ ! -f "$d/Archives_ZeroHour.txt" ] || [ ! -f "$d/Archives_Generals.txt" ]; then
              echo "::error::RTS_GAME_DIR_ZEROHOUR and RTS_GAME_DIR_GENERALS (the runner's .env) must name the game folder (Archives_ZeroHour.txt, Archives_Generals.txt, Big, Data, Packs)"
              exit 1
            fi
          done

      - name: Play Golden Replays
        shell: sh
        run: |
          p="$RUNNER_TEMP/package"
          out="$GITHUB_WORKSPACE/crc/macos-arm64"
          status=0
          sh "$p/play_golden.sh" GeneralsMD "$p/bin/generalszh" "$RTS_GAME_DIR_ZEROHOUR" "$RUNNER_TEMP/zh" "$out" "$p/replays/GeneralsMD" || status=1
          sh "$p/play_golden.sh" Generals "$p/bin/generalsv" "$RTS_GAME_DIR_GENERALS" "$RUNNER_TEMP/g" "$out" "$p/replays/Generals" || status=1
          exit $status

      - name: Upload CRC Logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: crc-macos-arm64
          path: |
            crc/macos-arm64/*.crc.log
            crc/macos-arm64/*.out.txt
          retention-days: 30

      # The work folders are hard-link mirrors of the game folder (no copies); they and the package go after each run.
      - name: Clean Up
        if: always()
        shell: sh
        run: rm -rf "$RUNNER_TEMP/zh" "$RUNNER_TEMP/g" "$RUNNER_TEMP/package" "$GITHUB_WORKSPACE/crc"

  compare:
    name: Compare with the Windows x64 reference
    needs: replays
    if: github.event_name == 'workflow_dispatch' && github.repository_owner == 'Muhammadbori'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download CRC Logs
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: crc-macos-arm64
          path: crc/macos-arm64

      - name: Compare Frame by Frame
        run: python3 scripts/ci/compare_crc_dirs.py Tests/GoldenReplays/crc/windows-x64 crc/macos-arm64
