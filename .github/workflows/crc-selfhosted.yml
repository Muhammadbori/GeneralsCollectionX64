# TheSuperHackers @build O140 Generals Collection x64: the replay CRC gate of the macOS port (M3), on a self-hosted Mac.
#
# O165: one self-hosted runner, an Apple Silicon Mac (label "generals-macos"). Its CRC logs are compared with the
# Windows x64 reference logs kept in Tests/GoldenReplays/crc/windows-x64 (made with the Windows x64 build from the same
# replays; numbers only, no game data). There is no Windows runner.
#
# The game data never leaves the Mac: the runner names its game folders in its own .env file (RTS_GAME_DIR_ZEROHOUR and
# RTS_GAME_DIR_GENERALS, not in this repository). play_golden.py plays Tests/GoldenReplays headless with -logicCrcLog;
# only the per-frame CRC logs are uploaded.
#
# Manual only (workflow_dispatch), and only in this owner's repository: a public repository must never run code from
# other people's pull requests on this machine. See dx12-notes/plan10-boburbek-mac-runner.md for setting the Mac up.
name: Replay CRC (self-hosted)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  macos:
    name: macOS arm64 replays vs Windows x64 reference
    if: github.event_name == 'workflow_dispatch' && github.repository_owner == 'Muhammadbori'
    runs-on: [self-hosted, macOS, ARM64, generals-macos]
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check Game Folders
        shell: bash
        run: |
          for v in RTS_GAME_DIR_ZEROHOUR RTS_GAME_DIR_GENERALS; do
            d="${!v:-}"
            if [ -z "$d" ] || [ ! -f "$d/Archives_ZeroHour.txt" ] || [ ! -f "$d/Archives_Generals.txt" ]; then
              echo "::error::$v must name the game folder (with Archives_ZeroHour.txt, Archives_Generals.txt, Big, Data, Packs)"
              exit 1
            fi
          done

      - name: Build
        run: |
          cmake --preset macos-arm64 -B build/ci
          cmake --build build/ci --target z_generals g_generals

      - name: Play Golden Replays
        run: |
          python3 scripts/ci/play_golden.py --game GeneralsMD --exe build/ci/GeneralsMD/generalszh --game-dir "$RTS_GAME_DIR_ZEROHOUR" --work-dir "$RUNNER_TEMP/zh" --out crc/macos-arm64
          python3 scripts/ci/play_golden.py --game Generals --exe build/ci/Generals/generalsv --game-dir "$RTS_GAME_DIR_GENERALS" --work-dir "$RUNNER_TEMP/g" --out crc/macos-arm64

      - name: Upload CRC Logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: crc-macos-arm64
          path: |
            crc/macos-arm64/*.crc.log
            crc/macos-arm64/*.out.txt
          retention-days: 30

      - name: Compare Frame by Frame
        run: python3 scripts/ci/compare_crc_dirs.py Tests/GoldenReplays/crc/windows-x64 crc/macos-arm64

      # The work folders are hard-link mirrors of the game folder (no copies); they are removed after each run.
      - name: Clean Up
        if: always()
        run: rm -rf "$RUNNER_TEMP/zh" "$RUNNER_TEMP/g"
